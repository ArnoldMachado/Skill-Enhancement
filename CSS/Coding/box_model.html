<!DOCTYPE html>
<html>
<head>
    <style>
        * { box-sizing: border-box; }
        .box { width: 300px; height: 150px; background: #ddd; }
        .bordered {
            border: 4px dashed red;
            margin: 20px;
            padding: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="box bordered">
        Content area with margin, border, and padding applied.
    </div>
</body>
</html>
