<!DOCTYPE html>
<html>
<head>
    <style>
        .button {
            background: steelblue;
            color: white;
            padding: 12px 24px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s ease;
        }
        .button:hover {
            background: darkblue;
        }
        .card {
            width: 250px;
            padding: 20px;
            margin-top: 30px;
            background: white;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 8px;
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <h2>CSS Transitions Lab</h2>
    <button class="button">Hover for Color Fade</button>
    <div class="card">
        <h3>Hover Card</h3>
        <p>This card uses a transition to smoothly move up and add a shadow effect.</p>
    </div>
</body>
</html>
