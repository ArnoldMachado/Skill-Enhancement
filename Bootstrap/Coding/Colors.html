<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-3">
  <h2>One</h2>
  <p>This is a paragraph</p>
  <p class="text-danger">This text is simple.</p>
  <p class="text-bg-success">This text is simple too.).</p>
</div>

<div>
    <div class="container mt-3">
  <h2>Two</h2>
  <p class="text-bg-primary">This text is important.</p>
  <p class="text-bg-success">This text indicates success.</p>
  
</div>
<div class="container mt-3">
  <h1>Shadows</h1>
  <p>These classes are used to add shadows to an element:</p>
  <div class="shadow p-4 mb-4 bg-white">This is default shadow</div>
  <div class="shadow-lg p-4 mb-4 bg-white">This is a Large shadow</div>
</div>
</body>
</html>
